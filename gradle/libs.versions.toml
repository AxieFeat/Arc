metadata.format.version = "1.1"

[versions]

kotlin = "2.4.10"
kotlinx-io = "0.9.2"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
korlibs = "6.1.0"
ditchoom-buffer = "6.30.10"
agp = "9.5.1"
ksp = "2.3.10" # Not forget to keep in sync with kotlin version

lwjgl = "3.4.3"
gson = "2.15.0"
annotations = "26.1.0"
fastutil = "8.5.19"
oshi = "7.7.3"
commons-io = "2.22.0"
detekt = "1.23.8"
logging = "8.0.6"
logback = "1.6.6"

[libraries]

kotlinx-io = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
korlibs-math-vector = { group = "org.korge", name = "korlibs-math-vector", version.ref = "korlibs" }
ditchoom-buffer = { group = "com.ditchoom", name = "buffer", version.ref = "ditchoom-buffer" }

annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
fastutil = { group = "it.unimi.dsi", name = "fastutil", version.ref = "fastutil" }
ksp = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
oshi = { group = "com.github.oshi", name = "oshi-core", version.ref = "oshi" }
commonsIo = { group = "commons-io", name = "commons-io", version.ref = "commons-io" }
logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "logging" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

lwjgl-lib = { group = "org.lwjgl", name = "lwjgl", version.ref = "lwjgl" }
lwjgl-glfw = { group = "org.lwjgl", name = "lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-egl = { group = "org.lwjgl", name = "lwjgl-egl", version.ref = "lwjgl" }
lwjgl-stb = { group = "org.lwjgl", name = "lwjgl-stb", version.ref = "lwjgl" }
lwjgl-freetype = { group = "org.lwjgl", name = "lwjgl-freetype", version.ref = "lwjgl" }
lwjgl-harfbuzz = { group = "org.lwjgl", name = "lwjgl-harfbuzz", version.ref = "lwjgl" }
lwjgl-vma = { group = "org.lwjgl", name = "lwjgl-vma", version.ref = "lwjgl" }
lwjgl-shaderc = { group = "org.lwjgl", name = "lwjgl-shaderc", version.ref = "lwjgl" }
lwjgl-assimp = { group = "org.lwjgl", name = "lwjgl-assimp", version.ref = "lwjgl" }
lwjgl-opengl = { group = "org.lwjgl", name = "lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-opengles = { group = "org.lwjgl", name = "lwjgl-opengles", version.ref = "lwjgl" }
lwjgl-vulkan = { group = "org.lwjgl", name = "lwjgl-vulkan", version.ref = "lwjgl" }
lwjgl-openal = { group = "org.lwjgl", name = "lwjgl-openal", version.ref = "lwjgl" }

# Plugins
plugin-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-ksp = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
plugin-detekt = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
plugin-multiplatform = { group = "com.android.kotlin.multiplatform.library", name = "com.android.kotlin.multiplatform.library.gradle.plugin", version.ref = "agp" }

[bundles]

logging = ["logging", "logback"]
